{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block body_class %}sw-auth-page{% endblock %}

{% block content %}
<section class="sw-auth-wrap">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="sw-auth-card">
          <div class="text-center mb-4">
            <span class="sw-brand-icon sw-brand-icon-lg mx-auto"><i class="bi bi-arrow-left-right"></i></span>
            <h1 class="sw-auth-title mt-3">Create your account</h1>
            <p class="sw-auth-sub">Join your campus skill-swap network in under a minute.</p>
          </div>

          <form method="POST" action="{{ url_for('register') }}" novalidate id="registerForm">
            <div class="mb-3">
              <label class="form-label d-block">I am a *</label>
              <div class="sw-role-toggle" role="radiogroup" aria-label="Account type">
                <input type="radio" class="sw-role-radio" id="type-student" name="account_type" value="student"
                       {% if (form_data.account_type or 'student') == 'student' %}checked{% endif %}
                       onchange="toggleAccountType()">
                <label class="sw-role-option" for="type-student">
                  <i class="bi bi-mortarboard"></i> Student
                </label>

                <input type="radio" class="sw-role-radio" id="type-faculty" name="account_type" value="faculty"
                       {% if form_data.account_type == 'faculty' %}checked{% endif %}
                       onchange="toggleAccountType()">
                <label class="sw-role-option" for="type-faculty">
                  <i class="bi bi-person-workspace"></i> Faculty
                </label>
              </div>
            </div>

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="name">Full name *</label>
                <input type="text" class="form-control sw-input" id="name" name="name"
                       value="{{ form_data.name or '' }}" placeholder="Tejas Mehta" required autofocus>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="email">Email address *</label>
                <input type="email" class="form-control sw-input" id="email" name="email"
                       value="{{ form_data.email or '' }}" placeholder="you@college.edu" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="password">Password *</label>
                <div class="input-group">
                  <input type="password" class="form-control sw-input" id="password" name="password"
                         placeholder="At least 6 characters" required>
                  <button class="btn btn-outline-secondary sw-eye-btn" type="button" onclick="togglePassword('password', this)" tabindex="-1">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="confirm_password">Confirm password *</label>
                <div class="input-group">
                  <input type="password" class="form-control sw-input" id="confirm_password" name="confirm_password"
                         placeholder="Re-enter password" required>
                  <button class="btn btn-outline-secondary sw-eye-btn" type="button" onclick="togglePassword('confirm_password', this)" tabindex="-1">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <!-- ============ STUDENT-ONLY FIELDS ============ -->
              <div class="col-md-6 sw-field-student">
                <label class="form-label" for="department">Department</label>
                <select class="form-select sw-input" id="department" name="department">
                  <option value="">Select department</option>
                  {% for d in DEPARTMENTS %}
                  <option value="{{ d }}" {% if form_data.department == d %}selected{% endif %}>{{ d }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-6 sw-field-student">
                <label class="form-label" for="year">Year</label>
                <select class="form-select sw-input" id="year" name="year">
                  <option value="">Select year</option>
                  {% for y in YEARS %}
                  <option value="{{ y }}" {% if form_data.year == y %}selected{% endif %}>{{ y }}</option>
                  {% endfor %}
                </select>
              </div>

              <!-- ============ FACULTY-ONLY FIELDS ============ -->
              <div class="col-md-6 sw-field-faculty" style="display:none">
                <label class="form-label" for="designation">Designation *</label>
                <input type="text" class="form-control sw-input" id="designation" name="designation"
                       value="{{ form_data.designation or '' }}" placeholder="Assistant Professor">
              </div>
              <div class="col-md-6 sw-field-faculty" style="display:none">
                <label class="form-label" for="qualifications">Qualifications</label>
                <input type="text" class="form-control sw-input" id="qualifications" name="qualifications"
                       value="{{ form_data.qualifications or '' }}" placeholder="Ph.D. in Computer Science">
              </div>
            </div>

            <button type="submit" class="btn sw-btn-primary w-100 py-2 mt-4">Create account</button>
          </form>

          <script>
            function toggleAccountType() {
              var isFaculty = document.getElementById('type-faculty').checked;
              document.querySelectorAll('.sw-field-faculty').forEach(function (el) {
                el.style.display = isFaculty ? '' : 'none';
              });
              document.querySelectorAll('.sw-field-student').forEach(function (el) {
                el.style.display = isFaculty ? 'none' : '';
              });
              document.getElementById('designation').required = isFaculty;
            }
            document.addEventListener('DOMContentLoaded', toggleAccountType);
          </script>

          <p class="text-center sw-auth-foot mt-4 mb-0">
            Already have an account? <a href="{{ url_for('login') }}">Log in</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
